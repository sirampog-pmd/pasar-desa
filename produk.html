<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semua Produk - DesaMart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/produk.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-store"></i> Desa<span>Mart</span>
            </a>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cari produk UMKM desa...">
            </div>
            <div class="nav-actions">
                <a href="keranjang.html" class="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="badge" id="cartCount">0</span>
                </a>
                <button class="btn-outline">Masuk</button>
                <button class="btn-primary">Daftar</button>
            </div>
            <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
        </div>
    </nav>

    <!-- BREADCRUMB -->
    <div class="breadcrumb-bar">
        <div class="container">
            <a href="index.html">Home</a>
            <i class="fas fa-chevron-right"></i>
            <span id="breadcrumbCat">Semua Produk</span>
        </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="container katalog-layout">
        <!-- SIDEBAR FILTER -->
        <aside class="filter-sidebar" id="filterSidebar">
            <div class="filter-header">
                <h3><i class="fas fa-sliders-h"></i> Filter</h3>
                <button class="filter-close" id="filterClose"><i class="fas fa-times"></i></button>
            </div>

            <!-- Kategori -->
            <div class="filter-group">
                <h4>Kategori</h4>
                <label class="filter-item">
                    <input type="radio" name="kategori" value="all" checked>
                    <span>Semua Kategori</span>
                </label>
                <label class="filter-item">
                    <input type="radio" name="kategori" value="makanan">
                    <span>Makanan</span>
                </label>
                <label class="filter-item">
                    <input type="radio" name="kategori" value="minuman">
                    <span>Minuman</span>
                </label>
                <label class="filter-item">
                    <input type="radio" name="kategori" value="kriya">
                    <span>Kerajinan</span>
                </label>
                <label class="filter-item">
                    <input type="radio" name="kategori" value="pertanian">
                    <span>Pertanian</span>
                </label>
                <label class="filter-item">
                    <input type="radio" name="kategori" value="fashion">
                    <span>Fashion</span>
                </label>
                <label class="filter-item">
                    <input type="radio" name="kategori" value="kecantikan">
                    <span>Kecantikan</span>
                </label>
            </div>

            <!-- Harga -->
            <div class="filter-group">
                <h4>Rentang Harga</h4>
                <div class="price-inputs">
                    <input type="number" id="hargaMin" placeholder="Min" min="0">
                    <span>—</span>
                    <input type="number" id="hargaMax" placeholder="Max" min="0">
                </div>
                <div class="price-presets">
                    <button class="preset-btn" data-min="0" data-max="50000">&lt; 50rb</button>
                    <button class="preset-btn" data-min="50000" data-max="100000">50-100rb</button>
                    <button class="preset-btn" data-min="100000" data-max="300000">100-300rb</button>
                    <button class="preset-btn" data-min="300000" data-max="999999999">&gt; 300rb</button>
                </div>
            </div>

            <!-- Rating -->
            <div class="filter-group">
                <h4>Rating Minimum</h4>
                <label class="filter-item">
                    <input type="radio" name="rating" value="0" checked>
                    <span>Semua Rating</span>
                </label>
                <label class="filter-item">
                    <input type="radio" name="rating" value="4.5">
                    <span><i class="fas fa-star" style="color:#fbbf24"></i> 4.5+</span>
                </label>
                <label class="filter-item">
                    <input type="radio" name="rating" value="4.8">
                    <span><i class="fas fa-star" style="color:#fbbf24"></i> 4.8+</span>
                </label>
            </div>

            <!-- Diskon -->
            <div class="filter-group">
                <h4>Lainnya</h4>
                <label class="filter-item">
                    <input type="checkbox" id="filterDiskon">
                    <span>Hanya Produk Diskon</span>
                </label>
            </div>

            <button class="btn-primary btn-reset" id="resetFilter">
                <i class="fas fa-redo"></i> Reset Filter
            </button>
        </aside>

        <!-- PRODUK AREA -->
        <main class="produk-area">
            <div class="produk-toolbar">
                <div>
                    <h2 id="produkTitle">Semua Produk</h2>
                    <p id="produkCount">Menampilkan 0 produk</p>
                </div>
                <div class="toolbar-actions">
                    <button class="filter-toggle-btn" id="filterToggle">
                        <i class="fas fa-sliders-h"></i> Filter
                    </button>
                    <select id="sortSelect" class="sort-select">
                        <option value="relevan">Paling Relevan</option>
                        <option value="termurah">Harga Terendah</option>
                        <option value="termahal">Harga Tertinggi</option>
                        <option value="rating">Rating Tertinggi</option>
                        <option value="terjual">Terlaris</option>
                    </select>
                </div>
            </div>

            <!-- Active filters chips -->
            <div class="active-filters" id="activeFilters"></div>

            <!-- Grid produk -->
            <div class="produk-grid" id="produkGrid"></div>

            <!-- Empty state -->
            <div class="empty-state" id="emptyState" style="display:none">
                <i class="fas fa-search"></i>
                <h3>Produk tidak ditemukan</h3>
                <p>Coba ubah filter atau kata kunci pencarian Anda</p>
                <button class="btn-primary" onclick="document.getElementById('resetFilter').click()">Reset Filter</button>
            </div>
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 DesaMart. Semua hak dilindungi.</p>
            </div>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/produk.js"></script>
</body>
</html>
